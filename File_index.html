<!doctype html>
<html lang="en">

<head>
  <meta http-equiv="Content-Security-Policy" content="
default-src 'self';
script-src 'self';
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
font-src 'self' https://fonts.gstatic.com;
img-src 'self' data: blob:;
connect-src 'self';
object-src 'none';
base-uri 'self';">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Index</title>
</head>
<style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 13px;
    background: #e8eaf0;
    color: #1a1a2e;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .hidden {
    display: none;
  }

  .custom-alert-modal {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.68);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20000;
  }

  .custom-alert-modal.show {
    display: flex;
  }

  .custom-alert-card {
    width: min(420px, 100%);
    background: var(--app-surface, #ffffff);
    color: var(--app-text, #111827);
    border: 1px solid var(--app-border, transparent);
    border-radius: 16px;
    padding: 22px 22px 20px;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
    text-align: center;
  }

  .custom-alert-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    margin: 0 auto 12px;
    display: grid;
    place-items: center;
    font-size: 23px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #0ea5e9, #6366f1);
  }

  .custom-alert-card h3 {
    font-size: 18px;
    margin-bottom: 8px;
  }

  .custom-alert-card p {
    font-size: 14px;
    line-height: 1.5;
    color: var(--app-muted, #4b5563);
    margin-bottom: 16px;
  }

  .custom-alert-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .custom-alert-btn {
    border: none;
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .custom-alert-btn.primary {
    background: linear-gradient(135deg, #0ea5e9, #6366f1);
    color: #fff;
  }

  .custom-alert-btn.secondary {
    background: var(--app-surface-alt, #e5e7eb);
    color: var(--app-text, #374151);
    border: 1px solid var(--app-border, transparent);
  }

  /* ── Title Bar ── */
  .title-bar {
    background: #1a2340;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    user-select: none;
    min-height: 38px;
  }

  .title-bar .btn-back,
  .title-bar .btn-clear {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #2c3a5c;
    border: 1px solid #3d4f78;
    color: #cdd5e8;
    padding: 3px 10px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
    margin-left: 5px;
  }

  .title-bar .btn-back:hover,
  .title-bar .btn-clear:hover {
    background: #3a4e70;
  }

  .patient-name-container {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 3px 10px;
    border-radius: 3px;
    font-size: 12px;
    margin-left: 12px;
    user-select: text;
  }

  .patient-name-label {
    color: #aab;
    font-weight: 500;
  }

  .patient-name-value {
    color: #4facfe;
    font-weight: 600;
  }

  .title-bar .btn-back svg,
  .title-bar .btn-clear svg {
    width: 12px;
    height: 12px;
    fill: currentColor;
  }

  .title-bar .title-text {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
    letter-spacing: 0.02em;
  }

  .win-controls {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }

  .win-btn {
    width: 22px;
    height: 22px;
    background: transparent;
    border: none;
    color: #aab;
    cursor: pointer;
    font-size: 14px;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .win-btn:hover {
    background: #3a4e70;
  }

  .win-btn.close:hover {
    background: #c0392b;
    color: #fff;
  }

  /* ── Main Layout ── */
  .app-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Left Panel ── */
  .left-panel {
    width: 224px;
    min-width: 224px;
    background: #f0f2f7;
    border-right: 1px solid #d0d4e0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  /* ── Section Card ── */
  .section-card {
    border: 1px solid #c8ccd8;
    border-radius: 3px;
    margin: 8px 6px 0;
    background: #fff;
  }

  .section-card .section-header {
    background: #f5f6fa;
    border-bottom: 1px solid #d8dbe8;
    padding: 4px 8px;
    font-size: 11.5px;
    font-weight: 600;
    color: #2c3a5c;
    letter-spacing: 0.03em;
  }

  .section-body {
    padding: 8px;
  }

  /* Patient Search */
  .radio-group {
    display: flex;
    gap: 10px;
    margin-bottom: 6px;
    align-items: center;
  }

  .radio-group label {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 12px;
    cursor: pointer;
  }

  input[type="radio"],
  input[type="checkbox"] {
    accent-color: #2563c8;
    cursor: pointer;
  }

  .checkbox-row {
    display: flex;
    gap: 14px;
    margin-bottom: 8px;
  }

  .checkbox-row label {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 12px;
    cursor: pointer;
  }

  .field-label {
    font-size: 11.5px;
    color: #555;
    margin-bottom: 3px;
  }

  .search-row {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .search-row input[type="text"] {
    flex: 1;
    border: 1px solid #b0b6c8;
    border-radius: 2px;
    padding: 3px 6px;
    font-size: 12px;
    background: #fff;
    outline: none;
  }

  .search-row input[type="text"]:focus {
    border-color: #2563c8;
    box-shadow: 0 0 0 2px rgba(37, 99, 200, 0.15);
  }

  .btn-search {
    background: #2563c8;
    color: #fff;
    border: none;
    border-radius: 2px;
    padding: 3px 12px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 0.03em;
  }

  .btn-search:hover {
    background: #1a4fa8;
  }

  /* Patient list placeholder */
  .patient-list {
    border: 1px solid #c8ccd8;
    border-radius: 3px;
    margin: 6px 6px 0;
    background: #fff;
    min-height: 58px;
  }

  /* Admission Details */
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr auto;
    row-gap: 3px;
    column-gap: 10px;
  }

  .detail-label {
    font-size: 12px;
    color: #444;
  }

  .detail-value {
    font-size: 12px;
    color: #222;
    font-weight: 500;
    text-align: right;
  }

  .detail-value.placeholder {
    color: #999;
    font-weight: 400;
  }

  /* Document Description checkboxes */
  .doc-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    height: 57px;
  }

  .doc-list label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    cursor: pointer;
  }

  /* Image Source */
  .file-list-box {
    border: 1px solid #c0c5d4;
    border-radius: 2px;
    background: #fafbfd;
    height: 110px;
    margin-top: 4px;
    overflow-y: auto;
  }

  .file-list-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 100%;
    color: #4b5563;
    font-size: 12px;
    font-weight: 600;
  }

  .file-list-loading .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid #cbd5e1;
    border-top-color: #2563c8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* Select All row */
  .select-all-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px 4px;
    font-size: 12px;
  }

  .count-badge {
    color: #555;
    font-size: 12px;
  }

  .btn-refresh {
    width: 22px;
    height: 22px;
    background: #e0e4ef;
    border: 1px solid #bcc0d0;
    border-radius: 3px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
  }

  .btn-refresh:hover {
    background: #d0d6e8;
  }

  /* ── Right Panel ── */
  .right-panel {
    flex: 1;
    background: #e8eaf0;
  }

  /* ── Bottom Bar ── */
  .bottom-bar {
    background: #1a2340;
    color: #eef0f7;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.04em;
    cursor: pointer;
    user-select: none;
    border-top: 2px solid #2c6fdf;
    margin: 8px;
  }

  .bottom-bar:hover {
    background: #1e2c4a;
  }

  .bottom-bar .shortcut {
    font-size: 11px;
    color: #aab4cc;
    font-weight: 400;
  }

  .bottom-bar svg {
    width: 14px;
    height: 14px;
    fill: #7ba8f0;
  }

  .file-list {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 12px;
  }

  .image-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 120px;
  }

  .image-item img {
    width: 120px;
    height: 100px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  .image-item p {
    font-size: 11px;
    text-align: center;
    word-break: break-all;
    margin-top: 4px;
  }

  .main-layout {
    display: flex;
    height: 100vh;
    gap: 0;
  }

  /* LEFT - Image Preview */
  .image-preview {
    flex: 1;
    background-color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    border-right: 1px solid #333;
    overflow: hidden;
  }

  .image-preview img {
    max-width: 100%;
    max-height: calc(100vh - 60px);
    object-fit: contain;
    border-radius: 6px;
  }

  .preview-label {
    color: #aaa;
    font-size: 12px;
    margin-top: 10px;
    text-align: center;
    word-break: break-all;
  }

  .preview-placeholder,
  .preview-error {
    color: #666;
    font-size: 14px;
    text-align: center;
  }

  /* RIGHT - File List */
  .file-list {
    width: 260px;
    min-width: 200px;
    background-color: #f5f5f5;
    overflow-y: auto;
    padding: 8px 0;
    border-left: 1px solid #ddd;
  }

  .file-item {
    padding: 10px 16px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px solid #e0e0e0;
    color: #333;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.15s;
  }

  .file-item:hover {
    background-color: #e3f0ff;
    color: #0066cc;
  }

  .file-item.active {
    background-color: #0066cc;
    color: #fff;
    font-weight: 500;
  }

  .index-action-btn {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 1400;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 999px;
    background: linear-gradient(135deg, #2563c8 0%, #4facfe 100%);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 10px 24px rgba(37, 99, 200, 0.28);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .index-action-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 28px rgba(37, 99, 200, 0.32);
  }

  .index-action-btn:disabled {
    opacity: 0.7;
    cursor: wait;
    transform: none;
  }

  .no-files {
    padding: 16px;
    color: #999;
    font-size: 13px;
    text-align: center;
  }

  /* ── Status Modal Overlay ── */
  .status-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(10, 15, 30, 0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .status-modal.show {
    opacity: 1;
    pointer-events: auto;
  }

  .status-modal-content {
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 12px;
    width: 450px;
    max-width: 90%;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    overflow: hidden;
    transform: translateY(20px);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .status-modal.show .status-modal-content {
    transform: translateY(0);
  }

  .status-modal-header {
    background: #1a2340;
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .status-modal-header h3 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .status-modal-close {
    font-size: 22px;
    cursor: pointer;
    color: #aab4cc;
    transition: color 0.15s;
    line-height: 1;
    display: none;
    /* Only show on completion or error */
  }

  .status-modal-close:hover {
    color: #fff;
  }

  .status-modal-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .progress-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-bar-wrapper {
    flex: 1;
    height: 8px;
    background: #e2e8f0;
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2563c8 0%, #4facfe 100%);
    border-radius: 4px;
    transition: width 0.3s ease;
  }

  #progressPercent {
    font-size: 13px;
    font-weight: 700;
    color: #2c3a5c;
    min-width: 35px;
    text-align: right;
  }

  .progress-stats {
    font-size: 12px;
    color: #555;
    font-weight: 500;
  }

  .file-status-list {
    max-height: 180px;
    overflow-y: auto;
    border: 1px solid #dcdfe6;
    border-radius: 6px;
    background: #f8fafc;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .file-status-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: #fff;
    border: 1px solid #e4e7ed;
    border-radius: 4px;
    font-size: 12px;
    animation: slideIn 0.25s ease forwards;
  }

  .file-status-item .file-name {
    color: #303133;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 70%;
  }

  .file-status-item .file-state {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
  }

  .state-pending {
    color: #909399;
  }

  .state-moving {
    color: #2563c8;
  }

  .state-success {
    color: #67c23a;
  }

  .state-error {
    color: #f56c6c;
  }

  /* ── Flying File particle ── */
  .flying-file {
    position: fixed;
    z-index: 10000;
    background: linear-gradient(135deg, #2563c8 0%, #4facfe 100%);
    color: #fff;
    font-weight: 600;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 4px 12px rgba(37, 99, 200, 0.3);
    padding: 6px 10px;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* ── Bump Animation ── */
  .bump-effect {
    animation: targetBump 0.3s ease-out;
  }

  @keyframes targetBump {
    0% {
      transform: scale(1);
    }

    50% {
      transform: scale(1.4);
      color: #67c23a;
      font-weight: bold;
    }

    100% {
      transform: scale(1);
    }
  }

  /* ── Smooth Height Collapse ── */
  .collapsing-item {
    transition: all 0.4s ease !important;
    opacity: 0 !important;
    transform: translateX(-20px);
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(5px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>

<body>

  <!-- Title Bar -->
  <div class="title-bar">
    <button id="back" class="btn-back">
      <svg viewBox="0 0 10 10">
        <path d="M6.5 1 2 5l4.5 4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
      Back
    </button>
    <button id="clear" class="btn-clear">
      <svg viewBox="0 0 10 10">
        <path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" />
      </svg>
      Clear
    </button>

    <div class="patient-name-container">
      <span>Patient Name:</span>
      <span id="name">--</span>
    </div>

  </div>

  <!-- Body -->
  <div class="app-body">

    <!-- Left Panel -->
    <div class="left-panel">

      <!-- Patient Search -->
      <div class="section-card">
        <div class="section-header">Patient Search</div>
        <div class="section-body">
          <div class="radio-group">
            <label><input type="radio" name="ptype" value="IP"> IP</label>
            <label><input type="radio" name="ptype" value="OP"> OP</label>
            <label><input type="radio" name="ptype" value="ER"> ER</label>
          </div>
          <!-- <div class="checkbox-row">
            <label><input type="checkbox" id="uhid" value="UHID"> UHID</label>
            <label>
              <input type="checkbox" id="byip">
              <span id="byipText">By IP No.</span> </label>
          </div> -->
          <div class="field-label">Upload Files</div>
          <div class="search-row">
            <button id="search" class="btn-search" type="button">Upload Files</button>
          </div>
        </div>
      </div>

      <!-- Patient list -->
      <div class="section-card" style="margin-top:8px;">
        <div class="section-header">Patient ID Details</div>
        <div class="section-body" style="overflow-y:scroll">
          <div id="patientid" class="doc-list">
          </div>
        </div>
      </div>

      <!-- Admission Details -->
      <div class="section-card" style="margin-top:8px;">
        <div class="section-header">Admission Details</div>
        <div class="section-body">
          <div class="detail-grid">
            <!-- <span class="detail-label">Sheets Entered</span>
            <span id="filelistcount" class="detail-value">0</span>
            <span class="detail-label">Sheets Indexed</span>
            <span id="indexedCount" class="detail-value">0</span> -->
            <span class="detail-label">Admission Date</span>
            <span id="a-date" class="detail-value placeholder">--/--/----</span>
            <span class="detail-label">Discharge Date</span>
            <span id="d-date" class="detail-value placeholder">--/--/----</span>
          </div>
        </div>
      </div>

      <!-- Document Description -->
      <div class="section-card" style="margin-top:8px;">
        <div class="section-header">Document Description</div>
        <div class="section-body" style="overflow-y:scroll">
          <div id="d-list" class="doc-list">
          </div>
        </div>
      </div>

      <!-- Image Source -->
      <div class="section-card" style="margin-top:8px;">
        <div class="section-header">Image Source</div>
        <div class="section-body">
          <div class="field-label">Select files to include:</div>
          <div class="file-list-box" id="fileList"></div>
          <div class="select-all-row">
            <label style="display:flex;align-items:center;gap:5px;">
              <input type="checkbox" id="selectAll"> Select All
            </label>
            <span id="badge" class="count-badge">0 / 0</span>
            <!-- <button class="btn-refresh hidden" title="Refresh">&#x21BB;</button> -->
          </div>
        </div>
      </div>
      <!-- Bottom Action Bar -->

    </div><!-- /left-panel -->

    <!-- Right Panel (document viewer area) -->
    <div class="right-panel">
      <div class="main-layout">

        <!-- LEFT: Image Preview -->
        <div id="imagePreview" class="image-preview">
          <p class="preview-placeholder">Select a file to preview</p>
        </div>
      </div>
    </div>

  </div><!-- /app-body -->

  <div id="index" class="index-action-btn">
    <svg viewBox="0 0 16 16" width="16" height="16">
      <rect x="2" y="2" width="12" height="12" rx="1" stroke="#dbeafe" stroke-width="1.2" fill="none" />
      <path d="M5 8l2.5 2.5L11 5" stroke="#dbeafe" stroke-width="1.5" fill="none" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
    <span>Index</span>
  </div>

  <!-- File Indexing Status Modal -->
  <div id="statusModal" class="status-modal">
    <div class="status-modal-content">
      <div class="status-modal-header">
        <h3>Indexing & Moving Files</h3>
        <span class="status-modal-close" id="closeStatusModal">&times;</span>
      </div>
      <div class="status-modal-body">
        <div class="progress-container">
          <div class="progress-bar-wrapper">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-stats">
          <span id="progressCount">Moving 0 of 0 files...</span>
        </div>
        <div class="file-status-list" id="fileStatusList">
          <!-- Dynamically populated status items -->
        </div>
      </div>
    </div>
  </div>

  <div id="custom-alert-modal" class="custom-alert-modal" role="dialog" aria-modal="true"
    aria-labelledby="custom-alert-title">
    <div class="custom-alert-card">
      <div id="custom-alert-icon" class="custom-alert-icon">!</div>
      <h3 id="custom-alert-title">Notice</h3>
      <p id="custom-alert-message"></p>
      <div class="custom-alert-actions">
        <button id="custom-alert-cancel" class="custom-alert-btn secondary" type="button">Cancel</button>
        <button id="custom-alert-ok" class="custom-alert-btn primary" type="button">OK</button>
      </div>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="File_index.js"></script>
</body>
</html>
