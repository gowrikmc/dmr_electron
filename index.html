<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' blob:;"
    />
    <link rel="stylesheet" href="style.css">
    <title>DMR Application — Login</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', 'Segoe UI', sans-serif;
        background: var(--app-bg, #0a0f1e);
        color: var(--app-text, #fff);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* Animated background orbs */
      body::before {
        content: '';
        position: absolute;
        width: 600px; height: 600px;
        background: radial-gradient(circle, rgba(14,165,233,0.12) 0%, transparent 70%);
        border-radius: 50%;
        top: -150px; left: -150px;
        animation: orbFloat 8s ease-in-out infinite alternate;
        pointer-events: none;
      }
      body::after {
        content: '';
        position: absolute;
        width: 500px; height: 500px;
        background: radial-gradient(circle, rgba(99,102,241,0.10) 0%, transparent 70%);
        border-radius: 50%;
        bottom: -100px; right: -100px;
        animation: orbFloat 10s ease-in-out infinite alternate-reverse;
        pointer-events: none;
      }
      @keyframes orbFloat {
        from { transform: translate(0, 0) scale(1); }
        to   { transform: translate(40px, 30px) scale(1.08); }
      }

      /* Card */
      .card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 400px;
        margin: 0 20px;
        background: var(--app-surface, rgba(15, 23, 42, 0.85));
        border: 1px solid var(--app-border, rgba(148, 163, 184, 0.12));
        border-radius: 20px;
        padding: 40px 36px 36px;
        backdrop-filter: blur(20px);
        box-shadow:
          0 0 0 1px rgba(14,165,233,0.08),
          0 25px 50px rgba(0,0,0,0.5),
          0 0 80px rgba(14,165,233,0.05);
        animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(28px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* Brand header */
      .brand {
        text-align: center;
        margin-bottom: 32px;
      }
      .brand-logo {
        width: 52px; height: 52px;
        background: linear-gradient(135deg, #0ea5e9, #6366f1);
        border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        font-size: 26px;
        margin: 0 auto 16px;
        box-shadow: 0 8px 24px rgba(14,165,233,0.35);
      }
      .brand h1 {
        font-size: 22px;
        font-weight: 700;
        color: var(--app-text, #f1f5f9);
        letter-spacing: -0.3px;
      }
      .brand p {
        font-size: 13px;
        color: var(--app-muted, #64748b);
        margin-top: 4px;
      }

      /* Divider */
      .divider {
        height: 1px;
        background: linear-gradient(to right, transparent, var(--app-border, rgba(148,163,184,0.15)), transparent);
        margin-bottom: 28px;
      }

      /* Form fields */
      .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
      .field label {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--app-muted, #94a3b8);
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .field-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }
      .field-icon {
        position: absolute;
        left: 13px;
        color: var(--app-muted, #475569);
        font-size: 15px;
        pointer-events: none;
      }
      .field input, .field select {
        width: 100%;
        background: var(--app-input, rgba(30, 41, 59, 0.7));
        border: 1px solid var(--app-border, rgba(148,163,184,0.15));
        color: var(--app-text, #f1f5f9);
        border-radius: 10px;
        padding: 11px 14px 11px 38px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        appearance: none;
      }
      .field select { cursor: pointer; }
      .field input::placeholder { color: var(--app-muted, #475569); }
      .field input:focus, .field select:focus {
        border-color: var(--app-accent, rgba(14,165,233,0.6));
        background: var(--app-surface-alt, rgba(30, 41, 59, 0.95));
        box-shadow: 0 0 0 3px var(--app-accent-soft, rgba(14,165,233,0.12));
      }
      .field select option { background: var(--app-surface, white); color: var(--app-text, black); }

      /* Password toggle */
      #toggle-password {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        color: var(--app-muted, #475569);
        cursor: pointer;
        padding: 4px;
        font-size: 15px;
        transition: color 0.2s;
      }
      #toggle-password:hover { color: var(--app-text, #94a3b8); }

      /* Error */
      #login-error {
        font-size: 13px;
        color: #fff1f2;
        background: rgba(220, 38, 38, 0.18);
        border: 1px solid rgba(248, 113, 113, 0.7);
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 16px;
        display: none;
        text-align: center;
        font-weight: 600;
        letter-spacing: 0.01em;
        animation: shake 0.35s ease;
      }
      @keyframes shake {
        0%,100% { transform: translateX(0); }
        25%      { transform: translateX(-6px); }
        75%      { transform: translateX(6px); }
      }

      /* Submit button */
      #submit-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #0ea5e9, #6366f1);
        border: none;
        border-radius: 10px;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        margin-top: 6px;
        box-shadow: 0 4px 20px rgba(14,165,233,0.3);
        transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
        display: flex; align-items: center; justify-content: center; gap: 8px;
      }
      #submit-btn:hover {
        opacity: 0.92;
        box-shadow: 0 6px 28px rgba(14,165,233,0.45);
        transform: translateY(-1px);
      }
      #submit-btn:active { transform: scale(0.98); }
      #submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

      .spinner {
        width: 16px; height: 16px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: none;
      }
      #submit-btn.loading .spinner { display: block; }
      #submit-btn.loading .btn-text { opacity: 0.7; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Footer */
      .footer {
        text-align: center;
        margin-top: 24px;
        font-size: 11.5px;
        color: var(--app-muted, #334155);
      }
    </style>
  </head>
  <body>

    <form id="login-form" class="card" autocomplete="off">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-logo">📋</div>
        <h1>DMR Application</h1>
        <p>Document Management & Records</p>
      </div>

      <div class="divider"></div>

      <!-- Unit -->
      <div class="field">
        <label for="unit-select">Hospital Unit</label>
        <div class="field-wrap">
          <span class="field-icon">🏥</span>
          <span id="unit" style="margin-left: 46px;padding: 8px 0;"></span>
        </div>
      </div>

      <!-- Username -->
      <div class="field">
        <label for="username-input">Username</label>
        <div class="field-wrap">
          <span class="field-icon">👤</span>
          <input
            id="username-input"
            name="username"
            type="text"
            placeholder="Enter your username"
            autocomplete="username"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="field">
        <label for="password-input">Password</label>
        <div class="field-wrap">
          <span class="field-icon">🔒</span>
          <input
            id="password-input"
            name="password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button type="button" id="toggle-password" title="Show/hide password">👁</button>
        </div>
      </div>

      <!-- Error -->
      <div id="login-error"></div>

      <!-- Submit -->
      <button type="submit" id="submit-btn">
        <div class="spinner"></div>
        <span class="btn-text">Sign In</span>
      </button>

      <div class="footer">DMR v1.0 &nbsp;·&nbsp; Secure Login</div>
    </form>

    <script src="theme.js"></script>
    <script src="renderer.js"></script>
   
  </body>
</html>
